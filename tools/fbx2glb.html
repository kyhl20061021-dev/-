<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>FBX 几何提取</title>
<style>
  body { background: #14171a; color: #c9d3dc; font: 13px/1.6 ui-monospace, Consolas, monospace; padding: 24px; }
  pre { white-space: pre-wrap; }
</style>
</head>
<body>
<pre id="log">等待调用…</pre>
<script type="module">
import * as THREE from 'three';
import { FBXLoader } from 'three/examples/jsm/loaders/FBXLoader.js';

const logEl = document.getElementById('log');
const log = (...a) => { logEl.textContent += '\n' + a.join(' '); };

const isLod = n => /_LOD\d+$/i.test(n);
const lodIndex = n => { const m = /_LOD(\d+)$/i.exec(n); return m ? +m[1] : 0; };

/**
 * 从几何体里抽取 [start, start+count) 这段索引，逐顶点应用世界矩阵。
 * 自己建数组而不是 clone()，避免属性缓冲被多处共享后重复变换。
 */
function extract(geo, start, count, mtx, withNormal) {
  const P = geo.attributes.position;
  const N = geo.attributes.normal;
  const U = geo.attributes.uv;
  const src = geo.index ? geo.index.array : null;

  const map = new Map();
  const pos = [], nor = [], uv = [], idx = [];
  const v = new THREE.Vector3();
  const nm = new THREE.Matrix3().getNormalMatrix(mtx);

  for (let i = 0; i < count; i++) {
    const old = src ? src[start + i] : start + i;
    let ni = map.get(old);
    if (ni === undefined) {
      ni = pos.length / 3;
      map.set(old, ni);
      v.fromBufferAttribute(P, old).applyMatrix4(mtx);
      pos.push(v.x, v.y, v.z);
      if (withNormal && N) {
        v.fromBufferAttribute(N, old).applyMatrix3(nm).normalize();
        nor.push(v.x, v.y, v.z);
      } else {
        nor.push(0, 0, 0);
      }
      if (U) uv.push(U.getX(old), U.getY(old));
      else uv.push(0, 0);
    }
    idx.push(ni);
  }
  return { pos, nor, uv, idx, hadNormal: !!N };
}

window.convertFbx = async function (url) {
  const loader = new FBXLoader();
  const root = await loader.loadAsync(url);
  root.updateMatrixWorld(true);

  // 1) 只保留 LOD0 —— 包里每个模型都把 LOD0~3 放在同一个文件里
  let meshes = [];
  root.traverse(o => { if (o.isMesh && o.geometry?.attributes?.position) meshes.push(o); });
  if (!meshes.length) throw new Error('没有网格');
  if (meshes.some(o => isLod(o.name))) {
    const min = Math.min(...meshes.filter(o => isLod(o.name)).map(o => lodIndex(o.name)));
    meshes = meshes.filter(o => !isLod(o.name) || lodIndex(o.name) === min);
  }

  // 2) 按材质归并
  const byMat = new Map();
  let anyMissingUv = false;

  for (const o of meshes) {
    const matArr = Array.isArray(o.material) ? o.material : [o.material];
    const geo = o.geometry;
    const groups = geo.groups && geo.groups.length ? geo.groups : null;
    const total = geo.index ? geo.index.count : geo.attributes.position.count;

    const targets = [];
    if (groups && groups.length > 1 && matArr.length > 1) {
      for (const g of groups) targets.push({ mat: matArr[g.materialIndex], start: g.start, count: g.count });
    } else {
      targets.push({ mat: matArr[0], start: 0, count: total });
    }

    for (const t of targets) {
      const name = (t.mat && t.mat.name) || 'Default';
      const r = extract(geo, t.start, t.count, o.matrixWorld, true);
      if (!geo.attributes.uv) anyMissingUv = true;
      if (!byMat.has(name)) byMat.set(name, { pos: [], nor: [], uv: [], idx: [], hadNormal: r.hadNormal });
      const acc = byMat.get(name);
      const base = acc.pos.length / 3;
      acc.pos.push(...r.pos);
      acc.nor.push(...r.nor);
      acc.uv.push(...r.uv);
      for (const i of r.idx) acc.idx.push(i + base);
      acc.hadNormal = acc.hadNormal && r.hadNormal;
    }
  }

  // 3) 整体包围盒，用于摆正
  let minX = Infinity, minY = Infinity, minZ = Infinity;
  let maxX = -Infinity, maxY = -Infinity, maxZ = -Infinity;
  for (const acc of byMat.values()) {
    for (let i = 0; i < acc.pos.length; i += 3) {
      const x = acc.pos[i], y = acc.pos[i + 1], z = acc.pos[i + 2];
      if (x < minX) minX = x; if (x > maxX) maxX = x;
      if (y < minY) minY = y; if (y > maxY) maxY = y;
      if (z < minZ) minZ = z; if (z > maxZ) maxZ = z;
    }
  }
  const cx = (minX + maxX) / 2, cz = (minZ + maxZ) / 2;

  const toB64 = (arr) => {
    const bytes = new Uint8Array(arr.buffer);
    let s = '';
    const CH = 0x8000;
    for (let i = 0; i < bytes.length; i += CH) s += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
    return btoa(s);
  };

  const parts = [];
  for (const [matName, acc] of byMat) {
    const pos = new Float32Array(acc.pos.length);
    const nor = new Float32Array(acc.nor.length);
    const uv = new Float32Array(acc.uv.length);
    const idx = new Uint32Array(acc.idx.length);

    for (let i = 0, j = 0; i < acc.pos.length; i += 3, j += 1) {
      pos[i] = acc.pos[i] - cx;
      pos[i + 1] = acc.pos[i + 1] - minY;
      pos[i + 2] = acc.pos[i + 2] - cz;
      if (!acc.hadNormal) {
        // 法线缺失的部件整体留空，交给 Node 端补算
        nor[i] = nor[i + 1] = nor[i + 2] = 0;
      } else {
        nor[i] = acc.nor[i]; nor[i + 1] = acc.nor[i + 1]; nor[i + 2] = acc.nor[i + 2];
      }
    }
    for (let i = 0; i < acc.uv.length; i++) uv[i] = acc.uv[i];
    for (let i = 0; i < acc.idx.length; i++) idx[i] = acc.idx[i];

    parts.push({
      mat: matName,
      vertices: pos.length / 3,
      indices: idx.length,
      pos: toB64(pos),
      nor: toB64(nor),
      uv: toB64(uv),
      idx: toB64(idx),
      needNormal: !acc.hadNormal
    });
  }

  const result = {
    size: {
      x: +(maxX - minX).toFixed(3),
      y: +(maxY - minY).toFixed(3),
      z: +(maxZ - minZ).toFixed(3)
    },
    parts
  };

  log(url.split('/').pop(), '部件', parts.length, '尺寸',
    result.size.x.toFixed(1), result.size.y.toFixed(1), result.size.z.toFixed(1),
    anyMissingUv ? '缺UV!' : '');
  return result;
};

window.__ready = true;
log('转换器就绪');
</script>
</body>
</html>
